; Toy Pad Emulator for Lego Dimensions - ESP32-S3 firmware
;
; Build & flash:      pio run -e t-dongle-s3 -t upload
; Upload web UI:      pio run -e t-dongle-s3 -t uploadfs
; Host unit tests:    pio test -e native
;
; See README.md in this directory for details.

[platformio]
default_envs = t-dongle-s3
; The web UI is shared with the Node.js version and uploaded to LittleFS as-is.
data_dir = ../server

; Common settings for ESP32-S3 boards with native USB (Arduino core 3.x via pioarduino).
[esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
monitor_speed = 115200
; Use the USB-OTG peripheral with TinyUSB (instead of the USB-Serial/JTAG
; controller) and do not expose a CDC serial port: the device must only show
; the Toy Pad HID interface. Logs go to UART0 (TX/RX pins).
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  ESP32Async/AsyncTCP @ ^3.4.10
  ESP32Async/ESPAsyncWebServer @ ^3.9.6
  bblanchon/ArduinoJson @ ^7.4.2

; LilyGO T-Dongle-S3 (ESP32-S3, 16 MB flash, USB-A plug on the native USB pins)
[env:t-dongle-s3]
extends = esp32s3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Generic ESP32-S3 DevKitC-1 (8 MB flash). Connect the console to the "USB" port, not "UART".
[env:esp32-s3-devkitc-1]
extends = esp32s3

; Host side unit tests of the protocol/persistence code (lib/ToyPadCore).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
